<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="topGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="leftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="rightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="#0f172a" stroke="#1e293b" stroke-width="8"/>
  
  <!-- Glowing Portal Ambient -->
  <circle cx="256" cy="256" r="140" fill="#10b981" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Minecraft Isometric Dimension Block -->
  <!-- Top Face -->
  <polygon points="256,128 412,218 256,308 100,218" fill="url(#topGrad)" stroke="#6ee7b7" stroke-width="4"/>
  <!-- Left Face -->
  <polygon points="100,218 256,308 256,436 100,346" fill="url(#leftGrad)" stroke="#10b981" stroke-width="4"/>
  <!-- Right Face -->
  <polygon points="256,308 412,218 412,346 256,436" fill="url(#rightGrad)" stroke="#38bdf8" stroke-width="4"/>
  
  <!-- Dimensional Rift Center Core -->
  <polygon points="256,188 334,233 256,278 178,233" fill="#38bdf8" opacity="0.9"/>
  <circle cx="256" cy="233" r="16" fill="#ffffff" filter="url(#glow)"/>
</svg>
